<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Round Robin Schedule Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2em;
      background-color: #f4f4f4;
    }
    h1 {
      text-align: center;
    }
    label {
      display: block;
      margin-top: 1em;
    }
    input {
      width: 60px;
      margin-left: 1em;
    }
    button {
      margin: 1em 0.5em;
      padding: 0.5em 1em;
      font-size: 1em;
    }
    .schedule {
      margin-top: 2em;
      background: white;
      padding: 1em;
      border-radius: 8px;
    }
    .round {
      margin-bottom: 1em;
    }
    pre {
      background: #eee;
      padding: 1em;
      border-radius: 4px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Round Robin Schedule Generator</h1>
  <label>Number of Players (7–32): <input type="number" id="players" min="7" max="32" value="12"/></label>
  <label>Number of Rounds (3–8): <input type="number" id="rounds" min="3" max="8" value="4"/></label>
  <label>Max Jacks (3–5): <input type="number" id="jacks" min="3" max="5" value="4"/></label>
  <button onclick="generateSchedule()">Generate</button>
  <button onclick="exportCSV()">Export to CSV</button>
  <button onclick="window.print()">Print</button>

  <div class="schedule" id="schedule"></div>

  <script>
    const getPlayers = (n) => {
      const letters = [];
      for (let i = 0; i < n; i++) {
        letters.push(String.fromCharCode(65 + i));
      }
      return letters;
    };

    const shuffle = (arr) => arr.sort(() => Math.random() - 0.5);

    const teammateMatrix = {};
    const opponentMatrix = {};

    function generateSchedule() {
      const numPlayers = Math.min(32, Math.max(7, parseInt(document.getElementById('players').value)));
      const numRounds = Math.min(8, Math.max(3, parseInt(document.getElementById('rounds').value)));
      const maxJacks = Math.min(5, Math.max(3, parseInt(document.getElementById('jacks').value)));

      const players = getPlayers(numPlayers);
      const scheduleDiv = document.getElementById('schedule');
      scheduleDiv.innerHTML = '';

      // Initialize matrices
      players.forEach(p => {
        teammateMatrix[p] = {};
        opponentMatrix[p] = {};
        players.forEach(q => {
          teammateMatrix[p][q] = 0;
          opponentMatrix[p][q] = 0;
        });
      });

      const rounds = [];

      for (let r = 0; r < numRounds; r++) {
        const roundPlayers = shuffle([...players]);
        const mod = numPlayers % 4;
        const matches = [];
        let used = [];

        const matchPlayers = (type) => {
          let group = [];
          for (let p of roundPlayers) {
            if (!used.includes(p)) {
              group.push(p);
              if (group.length === type) break;
            }
          }
          if (group.length === type) {
            used.push(...group);
            return group;
          }
          return null;
        };

        if (mod === 1) {
          matches.push({ type: '1v2', players: matchPlayers(3) });
          matches.push({ type: '1v1', players: matchPlayers(2) });
        } else if (mod === 2) {
          matches.push({ type: '1v1', players: matchPlayers(2) });
        } else if (mod === 3) {
          matches.push({ type: '1v2', players: matchPlayers(3) });
        }

        while (used.length + 4 <= numPlayers) {
          const group = matchPlayers(4);
          if (group) matches.push({ type: '2v2', players: group });
          else break;
        }

        const sitOut = roundPlayers.filter(p => !used.includes(p));
        rounds.push({ matches, sitOut });

        // Display
        const roundDiv = document.createElement('div');
        roundDiv.className = 'round';
        roundDiv.innerHTML = `<h3>Round ${r + 1}</h3>`;
        matches.forEach((m, i) => {
          let desc = '';
            if (m.type === '2v2') {
            desc = `${m.players[0]} & ${m.players[1]} vs ${m.players[2]} & ${m.players[3]}`;
            updateMatrix(m.players.slice(0,2), m.players.slice(2,4));
            } else if (m.type === '1v2') {
            desc = `${m.players[0]} vs ${m.players[1]} & ${m.players[2]}`;
            updateMatrix([m.players[1], m.players[2]], [m.players[0]]);
            } else if (m.type === '1v1') {
            desc = `${m.players[0]} vs ${m.players[1]}`;
            updateMatrix([], m.players);
            }
          roundDiv.innerHTML += `<p>Match ${i + 1}: ${desc}</p>`;
        });
        if (sitOut.length) {
          roundDiv.innerHTML += `<p><strong>Sit Out:</strong> ${sitOut.join(', ')}</p>`;
        }
        scheduleDiv.appendChild(roundDiv);
      }

      // Show matrices
      scheduleDiv.innerHTML += `<h3>Teammate Matrix</h3><pre>${matrixToString(teammateMatrix)}</pre>`;
      scheduleDiv.innerHTML += `<h3>Opponent Matrix</h3><pre>${matrixToString(opponentMatrix)}</pre>`;

      // Store for CSV
      window.generatedData = {
        inputs: { numPlayers, numRounds, maxJacks },
        rounds,
        teammateMatrix,
        opponentMatrix
      };
    }

    function updateMatrix(teamA, teamB) {
      const all = [...teamA, ...teamB];
      teamA.forEach(p => teamA.forEach(q => { if (p !== q) teammateMatrix[p][q]++; }));
      teamB.forEach(p => teamB.forEach(q => { if (p !== q) teammateMatrix[p][q]++; }));
      teamA.forEach(p => teamB.forEach(q => { opponentMatrix[p][q]++; opponentMatrix[q][p]++; }));
    }

    function matrixToString(matrix) {
      const players = Object.keys(matrix);
      let str = '   ' + players.join(' ') + '\n';
      players.forEach(p => {
        str += p + ' ';
        players.forEach(q => {
          str += ' ' + matrix[p][q];
        });
        str += '\n';
      });
      return str;
    }

    function exportCSV() {
      if (!window.generatedData) return alert('Please generate a schedule first.');
      const { inputs, rounds, teammateMatrix, opponentMatrix } = window.generatedData;
      let csv = `Inputs\nPlayers,${inputs.numPlayers}\nRounds,${inputs.numRounds}\nMax Jacks,${inputs.maxJacks}\n\nSchedule\n`;

      rounds.forEach((round, i) => {
        csv += `Round ${i + 1}\n`;
        round.matches.forEach((m, j) => {
        let matchDesc = '';
        if (m.type === '2v2') {
            matchDesc = `${m.players[0]} & ${m.players[1]} vs ${m.players[2]} & ${m.players[3]}`;
        } else if (m.type === '1v2') {
            matchDesc = `${m.players[0]} vs ${m.players[1]} & ${m.players[2]}`;
        } else if (m.type === '1v1') {
            matchDesc = `${m.players[0]} vs ${m.players[1]}`;
        }
        csv += `Match ${j + 1},${matchDesc}\n`;
        });
        if (round.sitOut.length) {
          csv += `Sit Out,${round.sitOut.join(',')}\n`;
        }
        csv += '\n';
      });

      csv += `Teammate Matrix\n${matrixToCSV(teammateMatrix)}\n`;
      csv += `Opponent Matrix\n${matrixToCSV(opponentMatrix)}\n`;

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'round_robin_schedule.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function matrixToCSV(matrix) {
      const players = Object.keys(matrix);
      let str = ',' + players.join(',') + '\n';
      players.forEach(p => {
        str += p + ',' + players.map(q => matrix[p][q]).join(',') + '\n';
      });
      return str;
    }
  </script>
</body>
</html>
