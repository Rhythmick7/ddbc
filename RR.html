<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Round Robin Schedule Generator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #222; padding: 20px; }
    h1 { text-align: center; margin-bottom: 20px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
    label { font-weight: bold; }
    input { width: 70px; text-align: center; }
    select, button { padding: 5px 10px; }
    button { cursor: pointer; border: none; background: #2563eb; color: white; border-radius: 5px; }
    button:hover { background: #1d4ed8; }
    pre { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); white-space: pre-wrap; }
    .export-buttons { text-align: center; margin-top: 10px; }
    table { border-collapse: collapse; margin: 20px auto; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: center; }
    th { background: #2563eb; color: white; }
  </style>
</head>
<body>
  <h1>Round Robin Schedule Generator</h1>

  <div class="controls">
    <label>Players:</label> <input id="players" type="number" min="4" max="32" value="13" />
    <label>Rounds:</label> <input id="rounds" type="number" min="1" value="4" />
    <label>Max Matches per Round:</label> <input id="maxMatches" type="number" min="1" value="5" />
    <button onclick="generate()">Generate Schedule</button>
  </div>

  <pre id="output"></pre>
  <div id="summary"></div>

  <div class="export-buttons" id="exportButtons" style="display:none;">
    <button onclick="exportCSV()">Export to CSV</button>
    <button onclick="exportPDF()">Export to PDF</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="scheduler.js" defer></script>
</body>
</html>
